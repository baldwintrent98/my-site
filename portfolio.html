<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <title>Portfolio</title>
    <link rel="icon" href="/favicon.ico">
    <link rel="stylesheet" href="css/main.css">
    <link href="https://fontshare.com[]=sentient@400,500,700&display=swap" rel="stylesheet">
    <link href="https://api.fontshare.com/v2/css?f[]=general-sans@300,400,500,600,700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="js/template.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/ScrollTrigger.min.js"></script>
    <script src="js/animate.js" defer></script>
    <style>
body{
  overflow-x:hidden;
}

.welcome{
  position:relative;
  overflow:hidden;
}

.welcome h1{
  font-size:clamp(4rem,12vw,9rem);
  line-height:1;
}

.welcome p{
  max-width:600px;
  font-size:1.2rem;
}

.blob{
  position:absolute;
  border-radius:50%;
  filter:blur(80px);
  opacity:.25;
  z-index:-1;
}

.blob.one{
  width:350px;
  height:350px;
  background:#5f8d65;
  top:10%;
  left:-100px;
}

.blob.two{
  width:450px;
  height:450px;
  background:#8db6a0;
  bottom:-150px;
  right:-150px;
}
.hero{
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  position:relative;
}

.hero-content{
  text-align:center;
}

.projects{
  width:min(1200px,90%);
  margin:auto;
  padding:120px 0;
}

.project{
  display:grid;
  grid-template-columns:1fr 500px;
  gap:80px;
  align-items:center;
  min-height:70vh;
}

.project-image{
  height:300px;
  border-radius:20px;
  background:white;
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:2rem;
  box-shadow:0 20px 40px rgba(0,0,0,.15);
}

.project + .project{
  margin-top:180px;
}

.project-text + a{
  color: rgb(13, 36, 21);
}
    </style>
</head>
  <body>
    <section class="hero">

        <div class="hero-content">
            <h1>Portfolio</h1>
        </div>

    </section>

    <section class="projects">

        <div class="project">
            <div class="project-text">
                <h2>BeginInt (Barely Started)</h2>
                <p>Github integration for beginner developers.</p>
                <a href="https://github.com/baldwintrent98/BeginInt">View Project →</a>
            </div>

            <div class="project-image">
                Example <p style="margin-top: 25px;">(coming some day...)</p>
            </div>
        </div>
